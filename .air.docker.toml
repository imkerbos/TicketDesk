# Air 热更新配置 - Docker 环境
# 参考: https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 构建命令
  cmd = "go build -o ./tmp/main ./cmd/ticketdesk"
  # 二进制文件路径
  bin = "./tmp/main"
  # 运行参数 - 使用 Docker 专用配置
  args_bin = ["-config", "configs/config.docker.yaml"]
  # 构建延迟（毫秒）
  delay = 1000
  # 排除目录
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "node_modules", "docs"]
  # 排除文件
  exclude_file = []
  # 排除正则
  exclude_regex = ["_test.go"]
  # 排除不变的文件
  exclude_unchanged = false
  # 跟踪符号链接
  follow_symlink = false
  # 日志目录
  full_bin = ""
  # 监听的文件扩展名
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  # 额外监听的目录
  include_dir = []
  # 额外监听的文件
  include_file = []
  # 构建时杀死延迟
  kill_delay = "0s"
  # 日志输出
  log = "build-errors.log"
  # 轮询模式（用于 Docker 环境）
  poll = true
  # 轮询间隔
  poll_interval = 1000
  # 文件变化后重新运行
  rerun = false
  # 重新运行延迟
  rerun_delay = 500
  # 发送中断信号
  send_interrupt = false
  # 停止时发送的信号
  stop_on_error = false

[color]
  # 自定义颜色
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  # 显示日志时间
  time = false
  # 只显示主日志
  main_only = false

[misc]
  # 退出时清理
  clean_on_exit = true

[screen]
  # 重新构建时清屏
  clear_on_rebuild = true
  # 保持滚动
  keep_scroll = true
