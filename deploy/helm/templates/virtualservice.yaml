{{- if and .Values.ingress.enabled (eq .Values.ingress.className "istio") }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-vs
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.ingress.host }}
  gateways:
    - {{ .Values.ingress.istio.gateway }}
  http:
    # WebSocket 直连后端（exact match 优先于 prefix）
    - match:
        - uri:
            exact: /ws
      route:
        - destination:
            host: {{ .Release.Name }}-backend
            port:
              number: {{ .Values.backend.port }}
      timeout: 86400s
    # 健康检查直连后端
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: {{ .Release.Name }}-backend
            port:
              number: {{ .Values.backend.port }}
      timeout: 10s
    # API
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: {{ .Release.Name }}-backend
            port:
              number: {{ .Values.backend.port }}
      timeout: 120s
    # Swagger UI (含 doc.json / static assets)
    - match:
        - uri:
            prefix: /swagger
      route:
        - destination:
            host: {{ .Release.Name }}-backend
            port:
              number: {{ .Values.backend.port }}
      timeout: 30s
    # 前端静态资源（catch-all）
    - route:
        - destination:
            host: {{ .Release.Name }}-frontend
            port:
              number: 80
{{- end }}
