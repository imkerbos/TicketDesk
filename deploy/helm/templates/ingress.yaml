{{- if and .Values.ingress.enabled (eq .Values.ingress.className "gateway") }}
{{- if .Values.ingress.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.ingress.gateway.name }}
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.gateway.gatewayClassName }}
  gatewayClassName: {{ .Values.ingress.gateway.gatewayClassName }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ingress.host }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.ingress.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.host }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.ingress.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
  hostnames:
    - {{ .Values.ingress.host }}
  rules:
    # WebSocket 直连后端
    - matches:
        - path:
            type: Exact
            value: /ws
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.port }}
    # 健康检查直连后端
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.port }}
    # API
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.port }}
      timeouts:
        request: 120s
    # Swagger UI
    - matches:
        - path:
            type: PathPrefix
            value: /swagger
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.port }}
      timeouts:
        request: 30s
    # 前端静态资源（catch-all）
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: 80
{{- end }}
