# TicketDesk 生产环境 Docker Compose
# 使用方式：
#   1. cd deploy && cp .env.example .env && 修改 .env 中的配置
#   2. docker compose up -d（或在项目根目录执行 make prod-d）
#   3. 访问 http://localhost (或配置的 WEB_PORT 端口)

services:
  # ============ 数据库 ============

  mysql:
    image: mysql:8.0
    container_name: ticketdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ticketdesk_root_2026}
      MYSQL_DATABASE: ${DB_NAME:-ticketdesk}
      MYSQL_USER: ${DB_USER:-ticketdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ticketdesk_pwd_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ticketdesk_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ticketdesk-internal

  # ============ 缓存 ============

  redis:
    image: redis:7-alpine
    container_name: ticketdesk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ticketdesk_redis_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ticketdesk_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketdesk-internal

  # ============ 后端 ============

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.prod
    container_name: ticketdesk-backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # Viper 环境变量覆盖（格式：配置路径用 _ 替代 .）
      # 数据库配置
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${DB_USER:-ticketdesk}
      - DATABASE_PASSWORD=${DB_PASSWORD:-ticketdesk_pwd_2026}
      - DATABASE_NAME=${DB_NAME:-ticketdesk}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ticketdesk_redis_2026}
      - REDIS_DB=${REDIS_DB:-0}
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      - JWT_ACCESS_EXPIRE=${JWT_ACCESS_EXPIRE:-7200}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-604800}
      # 应用配置
      - APP_PORT=${APP_PORT:-10010}
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 夜莺告警集成（可选）
      - NIGHTINGALE_ENABLE=${N9E_ENABLE:-false}
      - NIGHTINGALE_BASE_URL=${N9E_BASE_URL:-}
      - NIGHTINGALE_TOKEN=${N9E_TOKEN:-}
      - NIGHTINGALE_POLL_INTERVAL=${N9E_POLL_INTERVAL:-30}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10010/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ticketdesk-internal

  # ============ 前端 (Nginx) ============

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend.prod
    container_name: ticketdesk-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
      - BACKEND_HOST=backend
      - BACKEND_PORT=${APP_PORT:-10010}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ticketdesk-internal

networks:
  ticketdesk-internal:
    name: ticketdesk-internal
    driver: bridge

volumes:
  mysql_data:
    name: ticketdesk-mysql-data
  redis_data:
    name: ticketdesk-redis-data
  backend_logs:
    name: ticketdesk-backend-logs
  backend_uploads:
    name: ticketdesk-backend-uploads
