version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ticketdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketdesk
      MYSQL_USER: ticketdesk
      MYSQL_PASSWORD: ticketdesk123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ticketdesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TicketDesk 应用（可选，用于完整部署）
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ticketdesk-app
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - APP_ENV=development
  #     - DB_HOST=mysql
  #     - DB_PORT=3306
  #     - DB_USER=ticketdesk
  #     - DB_PASSWORD=ticketdesk123
  #     - DB_NAME=ticketdesk
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    name: ticketdesk-network
