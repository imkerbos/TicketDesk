basePath: /api/v1
definitions:
  dto.ActivityResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      details:
        type: string
      entity_id:
        type: integer
      entity_key:
        type: string
      entity_type:
        type: string
      id:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  dto.AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  dto.AddRoleMemberRequest:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  dto.AlertTimelineItem:
    properties:
      date:
        description: 日期
        type: string
      firing:
        description: 触发数量
        type: integer
      resolved:
        description: 恢复数量
        type: integer
    type: object
  dto.ApprovalRecordResponse:
    properties:
      approved_at:
        type: string
      approver_id:
        type: integer
      approver_name:
        type: string
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      instance_id:
        type: integer
      node_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ApproveRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
    type: object
  dto.AssigneeSummary:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
      completed:
        type: integer
      in_progress:
        type: integer
      total:
        type: integer
    type: object
  dto.CategoryResponse:
    properties:
      color:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      is_system:
        type: boolean
      label:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  dto.ComponentResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      lead_user:
        $ref: '#/definitions/internal_core-field_dto.UserBrief'
      lead_user_id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ConvertToIssueRequest:
    properties:
      assignee_id:
        type: integer
      issue_type_id:
        type: integer
      project_key:
        type: string
    required:
    - issue_type_id
    - project_key
    type: object
  dto.CreateCategoryRequest:
    properties:
      color:
        enum:
        - primary
        - success
        - danger
        - warning
        - info
        type: string
      label:
        maxLength: 50
        minLength: 1
        type: string
      name:
        maxLength: 30
        minLength: 1
        type: string
    required:
    - color
    - label
    - name
    type: object
  dto.CreateComponentRequest:
    properties:
      description:
        maxLength: 500
        type: string
      lead_user_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateFieldRequest:
    properties:
      default_value:
        maxLength: 500
        type: string
      description:
        maxLength: 500
        type: string
      field_key:
        maxLength: 50
        minLength: 2
        type: string
      field_name:
        maxLength: 100
        minLength: 1
        type: string
      field_type:
        enum:
        - text
        - textarea
        - number
        - date
        - datetime
        - select
        - multiselect
        - user
        - multiuser
        - version
        - component
        - label
        - epic_link
        - time_estimate
        - url
        - checkbox
        type: string
      options:
        description: JSON格式的选项配置
        type: string
      validation:
        description: JSON格式的校验规则
        type: string
    required:
    - field_key
    - field_name
    - field_type
    type: object
  dto.CreateIssueTypeRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 500
        type: string
      display_name:
        maxLength: 100
        minLength: 1
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - display_name
    - name
    type: object
  dto.CreateLabelRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 200
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateNotificationChannelRequest:
    properties:
      channel_type:
        enum:
        - lark
        - telegram
        type: string
      config: {}
      enabled:
        type: boolean
      name:
        maxLength: 100
        type: string
    required:
    - channel_type
    - config
    - name
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      lead_user_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      project_key:
        maxLength: 10
        minLength: 2
        type: string
      template:
        description: '"standard" 使用模版（默认），"blank" 空项目'
        type: string
    required:
    - lead_user_id
    - name
    - project_key
    type: object
  dto.CreateProjectRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      role_key:
        maxLength: 50
        minLength: 2
        type: string
      role_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - role_key
    - role_name
    type: object
  dto.CreateRequirementPoolRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      owner_id:
        type: integer
      project_id:
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/model.RequirementPoolType'
        enum:
        - global
        - project
    required:
    - name
    - owner_id
    - type
    type: object
  dto.CreateRequirementRequest:
    properties:
      assignee_id:
        type: integer
      category:
        $ref: '#/definitions/model.RequirementCategory'
      description:
        maxLength: 10000
        type: string
      end_date:
        description: '格式: 2006-01-02 或 2006-01-02 15:04:05'
        type: string
      pool_id:
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/model.RequirementPriority'
        enum:
        - P0
        - P1
        - P2
        - P3
      reporter_id:
        type: integer
      start_date:
        description: '格式: 2006-01-02 或 2006-01-02 15:04:05'
        type: string
      tags:
        items:
          type: string
        type: array
      target_project_id:
        type: integer
      title:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - category
    - pool_id
    - priority
    - title
    type: object
  dto.CreateUserRequest:
    properties:
      display_name:
        maxLength: 100
        type: string
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.CreateVersionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      release_date:
        description: '格式: 2006-01-02'
        type: string
    required:
    - name
    type: object
  dto.CreateWorkflowSchemeRequest:
    properties:
      issue_type_id:
        type: integer
      workflow_id:
        type: integer
    required:
    - issue_type_id
    - workflow_id
    type: object
  dto.DailyWorklogStat:
    properties:
      date:
        type: string
      entry_count:
        type: integer
      total_time_sec:
        type: integer
    type: object
  dto.DashboardStatsResponse:
    properties:
      alert_stats:
        description: 告警统计
        properties:
          today_created:
            description: 今日告警
            type: integer
          total_acked:
            description: 已确认告警
            type: integer
          total_firing:
            description: 触发中告警
            type: integer
          total_resolved:
            description: 已恢复告警
            type: integer
          week_created:
            description: 本周告警
            type: integer
        type: object
      issue_stats:
        description: 工单统计
        properties:
          today_created:
            description: 今日创建
            type: integer
          total_closed:
            description: 已关闭工单
            type: integer
          total_in_progress:
            description: 进行中工单
            type: integer
          total_open:
            description: 待处理工单
            type: integer
          total_resolved:
            description: 已解决工单
            type: integer
          week_created:
            description: 本周创建
            type: integer
          week_resolved:
            description: 本周解决
            type: integer
        type: object
      project_stats:
        description: 项目统计
        properties:
          total_members:
            description: 总成员数
            type: integer
          total_projects:
            description: 总项目数
            type: integer
        type: object
    type: object
  dto.DistributionItem:
    properties:
      name:
        description: 名称
        type: string
      ratio:
        description: 占比
        type: number
      value:
        description: 数量
        type: integer
    type: object
  dto.FieldDefinitionResponse:
    properties:
      created_at:
        type: string
      default_value:
        type: string
      description:
        type: string
      field_key:
        type: string
      field_name:
        type: string
      field_type:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      options:
        type: string
      project_id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
      validation:
        type: string
    type: object
  dto.FieldSchemeItem:
    properties:
      default_value:
        type: string
      field_id:
        type: integer
      is_required:
        type: boolean
      is_visible_create:
        type: boolean
      is_visible_detail:
        type: boolean
      is_visible_edit:
        type: boolean
      sort_order:
        type: integer
    required:
    - field_id
    type: object
  dto.FieldSchemeResponse:
    properties:
      created_at:
        type: string
      default_value:
        type: string
      field:
        $ref: '#/definitions/dto.FieldDefinitionResponse'
      field_id:
        type: integer
      id:
        type: integer
      is_required:
        type: boolean
      is_visible_create:
        type: boolean
      is_visible_detail:
        type: boolean
      is_visible_edit:
        type: boolean
      issue_type_id:
        type: integer
      project_id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  dto.FieldValueResponse:
    properties:
      display_value:
        type: string
      field_id:
        type: integer
      field_key:
        type: string
      field_name:
        type: string
      field_type:
        type: string
      value: {}
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 100
        type: string
    required:
    - email
    type: object
  dto.IssueStatsResponse:
    properties:
      assignee_distribution:
        description: 按指派人分布
        items:
          $ref: '#/definitions/dto.DistributionItem'
        type: array
      epic_distribution:
        description: 按 Epic 分布
        items:
          $ref: '#/definitions/dto.DistributionItem'
        type: array
      priority_distribution:
        description: 按优先级分布
        items:
          $ref: '#/definitions/dto.DistributionItem'
        type: array
      status_distribution:
        description: 按状态分布
        items:
          $ref: '#/definitions/dto.DistributionItem'
        type: array
      summary:
        properties:
          avg_resolve_time:
            description: 平均解决时间（小时）
            type: number
          closed:
            description: 已关闭
            type: integer
          in_progress:
            description: 进行中
            type: integer
          open:
            description: 待处理
            type: integer
          resolved:
            description: 已解决
            type: integer
          total:
            description: 总数
            type: integer
        type: object
      timeline:
        description: 按时间分组的统计
        items:
          $ref: '#/definitions/dto.TimelineItem'
        type: array
      type_distribution:
        description: 按类型分布
        items:
          $ref: '#/definitions/dto.DistributionItem'
        type: array
    type: object
  dto.IssueTypeResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.KanbanColumn:
    properties:
      count:
        type: integer
      key:
        type: string
      requirements:
        items:
          $ref: '#/definitions/dto.RequirementResponse'
        type: array
      title:
        type: string
    type: object
  dto.KanbanResponse:
    properties:
      columns:
        items:
          $ref: '#/definitions/dto.KanbanColumn'
        type: array
      group_by:
        type: string
      total:
        type: integer
    type: object
  dto.LabelResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        maxLength: 50
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.MFALoginRequest:
    properties:
      code:
        type: string
      user_id:
        type: integer
    required:
    - code
    - user_id
    type: object
  dto.MFASetupResponse:
    properties:
      account:
        description: 账户名
        type: string
      issuer:
        description: 发行者
        type: string
      otp_auth_url:
        description: 用于生成二维码的 URL
        type: string
      qr_code_data:
        description: Base64 编码的 QR 码图片
        type: string
      secret:
        description: Base32 编码的密钥
        type: string
    type: object
  dto.MFAStatusResponse:
    properties:
      enabled:
        type: boolean
      verified_at:
        type: string
    type: object
  dto.MFAVerifyRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  dto.NodeConfig:
    properties:
      action:
        description: 系统节点配置
        type: string
      approval_type:
        description: 审批节点配置
        type: string
      approver_role:
        description: 审批角色
        type: string
      approvers:
        description: 审批人 ID 列表
        items:
          type: integer
        type: array
      assignee_role:
        description: 指派角色
        type: string
      assignee_type:
        description: 工作节点配置
        type: string
      assignees:
        description: 指派人 ID 列表
        items:
          type: integer
        type: array
      description:
        description: 节点说明
        type: string
      parameters:
        additionalProperties:
          type: string
        description: 动作参数
        type: object
      target_status:
        description: 进入该节点时工单目标状态（open, in_progress, resolved, closed）
        type: string
      timeout_hours:
        description: 通用配置
        type: integer
    type: object
  dto.NodeResponse:
    properties:
      config:
        $ref: '#/definitions/dto.NodeConfig'
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      node_type:
        type: string
      position_x:
        type: integer
      position_y:
        type: integer
      updated_at:
        type: string
      workflow_id:
        type: integer
    type: object
  dto.NotificationChannelResponse:
    properties:
      channel_type:
        type: string
      config: {}
      created_at:
        type: string
      created_by:
        type: integer
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.PrioritySummary:
    properties:
      count:
        type: integer
      priority:
        $ref: '#/definitions/model.RequirementPriority'
    type: object
  dto.ProjectMemberResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      role:
        type: string
      role_name:
        type: string
      user:
        $ref: '#/definitions/internal_core-project_dto.UserBrief'
      user_id:
        type: integer
    type: object
  dto.ProjectResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      lead_user:
        $ref: '#/definitions/internal_core-project_dto.UserBrief'
      lead_user_id:
        type: integer
      member_count:
        type: integer
      name:
        type: string
      project_key:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ProjectRoleMemberResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      role_id:
        type: integer
      user:
        $ref: '#/definitions/internal_core-project_dto.UserBrief'
      user_id:
        type: integer
    type: object
  dto.ProjectRoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      member_count:
        type: integer
      permissions:
        items:
          type: string
        type: array
      project_id:
        type: integer
      role_key:
        type: string
      role_name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      display_name:
        maxLength: 100
        type: string
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.RejectRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
    required:
    - comment
    type: object
  dto.ReportResponse:
    properties:
      assignee_summary:
        items:
          $ref: '#/definitions/dto.AssigneeSummary'
        type: array
      avg_process_days:
        type: number
      end_date:
        type: string
      pool_id:
        type: integer
      pool_name:
        type: string
      priority_summary:
        items:
          $ref: '#/definitions/dto.PrioritySummary'
        type: array
      start_date:
        type: string
      status_summary:
        items:
          $ref: '#/definitions/dto.StatusSummary'
        type: array
      total_completed:
        type: integer
      total_created:
        type: integer
      total_rejected:
        type: integer
      trend_data:
        items:
          $ref: '#/definitions/dto.TrendData'
        type: array
    type: object
  dto.RequirementCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.RequirementCommentResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      requirement_id:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  dto.RequirementPoolResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      owner_id:
        type: integer
      owner_name:
        type: string
      project_id:
        type: integer
      project_name:
        type: string
      requirement_count:
        description: 需求数量
        type: integer
      status:
        $ref: '#/definitions/model.RequirementPoolStatus'
      type:
        $ref: '#/definitions/model.RequirementPoolType'
      updated_at:
        type: string
    type: object
  dto.RequirementResponse:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
      category:
        $ref: '#/definitions/model.RequirementCategory'
      comment_count:
        type: integer
      converted_issue_id:
        type: integer
      converted_issue_key:
        type: string
      converted_issue_status:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      creator_name:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: integer
      pool_id:
        type: integer
      pool_name:
        type: string
      priority:
        $ref: '#/definitions/model.RequirementPriority'
      progress:
        type: string
      reporter_id:
        type: integer
      reporter_name:
        type: string
      result:
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/model.RequirementStatus'
      tags:
        items:
          type: string
        type: array
      target_project_id:
        type: integer
      target_project_name:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 50
        minLength: 6
        type: string
    required:
    - new_password
    type: object
  dto.ResetPasswordWithTokenRequest:
    properties:
      new_password:
