host: localhost:10010
info:
  contact:
    name: TicketDesk
    url: https://github.com/kerbos/ticketdesk
  description: 项目化工单与告警联动系统 API. 一切问题都是工单, 一切告警都必须被跟进.
  license:
    name: MIT
  termsOfService: https://github.com/kerbos/ticketdesk
  title: TicketDesk API
  version: "1.0"
paths:
  /api/v1/activities:
    get:
      consumes:
      - application/json
      description: 分页查询活动日志列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 实体类型
        in: query
        name: entity_type
        type: string
      - description: 实体标识
        in: query
        name: entity_key
        type: string
      - description: 实体 ID
        in: query
        name: entity_id
        type: integer
      - description: 用户 ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.ActivityResponse'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: 查询活动列表
      tags:
      - Activity
  /api/v1/activities/recent:
    get:
      consumes:
      - application/json
      description: 获取最近的活动日志
      parameters:
      - default: 10
        description: 数量限制
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取最近活动
      tags:
      - Activity
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 请求重置密码，系统将发送重置链接到用户邮箱
      parameters:
      - description: 忘记密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 忘记密码
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 用户登录
      tags:
      - Auth
  /api/v1/auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: 登录流程中验证 MFA 码
      parameters:
      - description: MFA 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MFALoginRequest'
      produces:
      - application/json
